name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build (e.g. v1.0.0)
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Test
        run: swift test

      - name: Build a universal app
        run: Scripts/bundle.sh --universal --version "${{ steps.version.outputs.version }}"

      - name: Archive
        run: |
          cd .build/bundle
          ditto -c -k --keepParent GlassDeck.app GlassDeck.zip
          shasum -a 256 GlassDeck.zip > GlassDeck.zip.sha256
          lipo -info GlassDeck.app/Contents/MacOS/GlassDeck

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: GlassDeck ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            .build/bundle/GlassDeck.zip
            .build/bundle/GlassDeck.zip.sha256
          body: |
            ## Install

            1. Download `GlassDeck.zip` and move `GlassDeck.app` to `/Applications`.
            2. The build is signed ad hoc rather than notarised, so clear the
               quarantine flag once:

               ```sh
               xattr -dr com.apple.quarantine /Applications/GlassDeck.app
               ```

            Requires macOS 15 or later; Liquid Glass surfaces need macOS 26.
            Universal binary (Apple silicon + Intel).
