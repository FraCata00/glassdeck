name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kit:
    name: Kit portability (macOS 15)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Show toolchain
        run: swift --version
      # Only the kit: it must stay free of the Liquid Glass APIs, which need the
      # macOS 26 SDK. `swift test` would build the app target too, so it runs in
      # the job below instead.
      - name: Build GlassDeckKit
        run: swift build --target GlassDeckKit

  app:
    name: App and tests (macOS 26)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Build the app
        run: swift build -c release
      - name: Test
        run: swift test
      - name: Bundle GlassDeck.app
        run: Scripts/bundle.sh --version 0.0.0-ci
      - name: Check the bundle
        run: |
          APP=.build/bundle/GlassDeck.app
          test -x "$APP/Contents/MacOS/GlassDeck"
          plutil -lint "$APP/Contents/Info.plist"
          # The localisations are copied in by the bundle script rather than by
          # SwiftPM, so assert they reached the app instead of hearing about it
          # from someone running an Italian Mac.
          KIT="$APP/Contents/Resources/GlassDeck_GlassDeckKit.bundle/Contents/Resources"
          for table in "$APP/Contents/Resources"/{en,it}.lproj "$KIT"/{en,it}.lproj; do
            plutil -lint "$table/Localizable.strings"
          done
          codesign --verify --verbose "$APP"

  commits:
    name: Conventional commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6
