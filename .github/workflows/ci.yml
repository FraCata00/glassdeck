name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kit:
    name: Kit portability (macOS 15)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Show toolchain
        run: swift --version
      # Only the kit: it must stay free of the Liquid Glass APIs, which need the
      # macOS 26 SDK. `swift test` would build the app target too, so it runs in
      # the job below instead.
      - name: Build GlassDeckKit
        run: swift build --target GlassDeckKit

  app:
    name: App and tests (macOS 26)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Build the app
        run: swift build -c release
      - name: Test
        run: swift test
      - name: Bundle GlassDeck.app
        run: Scripts/bundle.sh --version 0.0.0-ci
      - name: Check the bundle
        run: |
          test -x .build/bundle/GlassDeck.app/Contents/MacOS/GlassDeck
          plutil -lint .build/bundle/GlassDeck.app/Contents/Info.plist
          codesign --verify --verbose .build/bundle/GlassDeck.app

  commits:
    name: Conventional commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6
